glePasswordIcon')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; padding: 4px; z-index: 5;" title="Show/Hide Password"><svg id="togglePasswordIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button type="submit" name="admin_login" class="btn-fill-parent btn-primary" style="width: 100%; margin: 0; margin-top: 4px; height: 44px; font-size: 14px;"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Unlock Dashboard</button></form></div></div></div><script>
function togglePasswordVisibility() {
const inp = document.getElementById('login_admin_password');
const icon = document.getElementById('togglePasswordIcon');
if (!inp || !icon) return;
const show = inp.type === 'password';
inp.type = show ? 'text' : 'password';
icon.innerHTML = show
? '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>'
: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>';
}
function showLoginAlert(message) {
const el = document.getElementById('loginAlert');
el.textContent = message;
el.style.display = 'flex';
}
async function handleLogin(event) {
event.preventDefault();
const form = event.target;
const btn = form.querySelector('button[type="submit"]');
if (btn) btn.disabled = true;
try {
const r = await fetch('/admin/login', {
method: 'POST',
credentials: 'same-origin',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ username: form.admin_username.value.trim(), password: form.admin_password.value })
});
const data = await r.json().catch(() => ({}));
if (r.ok && data.success) {
window.location.reload();
return;
}
showLoginAlert(data.message || 'Invalid username or password');
} catch (e) {
showLoginAlert('Network error. Please try again.');
}
if (btn) btn.disabled = false;
}
